<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperHeroFilms — фильмы и трейлеры</title>
<style>
  :root { --bg:#0b0f14; --card:#151b23; --text:#e8eaed; --muted:#8f9bab; --accent:#ff5500; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  header { position:sticky; top:0; z-index:10; background:rgba(11,15,20,.85); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.06); }
  .header-in { max-width:1240px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .logo { font-size:1.15rem; font-weight:800; letter-spacing:-.02em; color:var(--text); text-decoration:none; white-space:nowrap; }
  .logo span { color:var(--accent); }
  .search { flex:1; min-width:200px; display:flex; gap:8px; }
  .search input { flex:1; padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); color:var(--text); font-size:.95rem; outline:none; }
  .search input:focus { border-color:var(--accent); }
  .search button { padding:10px 18px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-weight:700; font-size:.9rem; cursor:pointer; }
  .search button:hover { filter:brightness(1.1); }

  main { max-width:1240px; margin:0 auto; padding:24px 20px 80px; }
  h1#section-title { margin:0 0 16px; font-size:1.5rem; letter-spacing:-.02em; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .chip { padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--muted); font-size:.85rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .15s; }
  .chip:hover { color:var(--text); border-color:rgba(255,255,255,.25); }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.best { background:linear-gradient(135deg,#ffb400,#ff5500); border-color:transparent; color:#fff; }
  .chip.best.active { filter:brightness(1.15); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:18px; }
  .card { position:relative; cursor:pointer; text-decoration:none; color:var(--text); display:block; }
  .card .poster { position:relative; aspect-ratio:2/3; border-radius:12px; overflow:hidden; background:var(--card); }
  .card .poster img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s; }
  .card:hover .poster img { transform:scale(1.04); }
  .card .rating { position:absolute; top:8px; left:8px; padding:3px 8px; border-radius:8px; font-size:.78rem; font-weight:800; background:rgba(11,15,20,.85); color:#ffd84d; }
  .card .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; background:rgba(0,0,0,.35); }
  .card:hover .play { opacity:1; }
  .card .play::before { content:"▶"; font-size:2rem; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .card .name { margin-top:8px; font-size:.9rem; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .year { margin-top:2px; font-size:.8rem; color:var(--muted); }

  .status { margin:30px 0; text-align:center; color:var(--muted); font-size:.9rem; }
  .spinner { display:inline-block; width:22px; height:22px; border:2px solid rgba(255,255,255,.2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .more { display:block; margin:30px auto 0; padding:12px 28px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--text); font-weight:700; font-size:.9rem; cursor:pointer; }
  .more:hover { background:rgba(255,255,255,.08); }
  .more[hidden] { display:none; }

  @media (max-width:640px) {
    .header-in { padding:12px 14px; }
    main { padding:18px 14px 60px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; }
    h1#section-title { font-size:1.2rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-in">
    <a class="logo" href="./">Super<span>Hero</span>Films</a>
    <form class="search" id="search-form">
      <input id="search-input" type="search" placeholder="Поиск фильма…" autocomplete="off">
      <button type="submit">Найти</button>
    </form>
  </div>
</header>

<main>
  <h1 id="section-title">Шедевры</h1>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
  <button class="more" id="more" hidden>Показать ещё</button>
</main>

<script>
(function () {
  var BASE = "https://functions.yandexcloud.net/d4e3i0pd816463uq33eu";
  var TRAILER = "./trailer.html";

  var CATEGORIES = [
    { id: "best",      title: " Шедевры",     isBest: true },
    { id: "action",    title: " Боевики",     params: { genre: "боевик",      minRating: "6.5", minVotes: "20000" } },
    { id: "comedy",    title: " Комедии",     params: { genre: "комедия",     minRating: "6.5", minVotes: "20000" } },
    { id: "scifi",     title: " Фантастика",  params: { genre: "фантастика",  minRating: "6.5", minVotes: "20000" } },
    { id: "thriller",  title: " Триллеры",    params: { genre: "триллер",     minRating: "7",   minVotes: "20000" } },
    { id: "horror",    title: " Ужасы",       params: { genre: "ужасы",       minRating: "6",   minVotes: "10000" } },
    { id: "drama",     title: " Драмы",       params: { genre: "драма",       minRating: "7.5", minVotes: "50000" } },
    { id: "adventure", title: " Приключения", params: { genre: "приключения", minRating: "7",   minVotes: "20000" } },
    { id: "crime",     title: "🕵️ Криминал",    params: { genre: "криминал",    minRating: "7",   minVotes: "30000" } },
    { id: "cartoon",   title: " Мультфильмы", params: { type: "cartoon",      minRating: "6.5", minVotes: "10000" } },
    { id: "melodrama", title: " Мелодрамы",   params: { genre: "мелодрама",   minRating: "6.5", minVotes: "20000" } }
  ];

  var state = {
    mode: "best",      // "best" | "category" | "search"
    cat: null,         // объект категории  
    query: "",
    page: 0,
    pages: 1,
    docs: [],
    loading: false  
  };

  var chipsEl  = document.getElementById("chips");
  var gridEl   = document.getElementById("grid");
  var statusEl = document.getElementById("status");
  var moreEl   = document.getElementById("more");
  var titleEl  = document.getElementById("section-title");
  var formEl   = document.getElementById("search-form");
  var inputEl  = document.getElementById("search-input");

  // ---------- построение URL ----------
  function catalogUrl(cat, page) {
    if (cat.isBest) {
      return BASE + "?catalog=1&best=1&page=" + page + "&limit=30";
    }
    var p = Object.assign({ catalog: "1", page: String(page), limit: "30" }, cat.params || {});
    return BASE + "?" + Object.keys(p).map(function (k) {
      return k + "=" + encodeURIComponent(p[k]);
    }).join("&");
  }

  function searchUrl(q, page) {
    return BASE + "?query=" + encodeURIComponent(q) + "&page=" + page + "&limit=30";
  }

  // ---------- чипы категорий ----------
  function renderChips() {
    chipsEl.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cat.isBest ? " best" : "");
      b.dataset.id = cat.id;
      b.textContent = cat.title;
      b.addEventListener("click", function () {
        if (state.mode === "category" && state.cat && state.cat.id === cat.id) return;
        if (state.mode === "best" && cat.isBest) return;
        state.mode = cat.isBest ? "best" : "category";
        state.cat = cat;
        state.query = "";
        inputEl.value = "";
        load(true);
      });
      chipsEl.appendChild(b);
    });
    updateChips();
  }

  function updateChips() {
    Array.prototype.forEach.call(chipsEl.children, function (b) {
      var active = false;
      if (state.mode === "best") active = b.dataset.id === "best";
      else if (state.mode === "category") active = state.cat && b.dataset.id === state.cat.id;
      b.classList.toggle("active", !!active);
    });
  }

  // ---------- карточка ----------
  function posterUrl(doc) {
    if (!doc || !doc.poster) return "";
    return doc.poster.url || doc.poster.previewUrl || "";
  }

  function ratingOf(doc) {
    if (!doc || !doc.rating) return "";
    var r = doc.rating.kp;
    if (!r || r < 1) r = doc.rating.imdb;
    return r && r >= 1 ? (Math.round(r * 10) / 10).toFixed(1) : "";
  }

  function cardHtml(doc) {
    var p = posterUrl(doc);
    var r = ratingOf(doc);
    var genres = (doc.genres || []).slice(0, 3).map(function (g) { return g.name; }).join(", ");
    var title = doc.name || doc.alternativeName || "Без названия";
    var year = doc.year || "";
    return '' +
      '<a class="card" href="' + TRAILER +
        '?kp=' + encodeURIComponent(doc.id) +
        '&title=' + encodeURIComponent(title) +
        '&year=' + encodeURIComponent(year) +
        '&rating=' + encodeURIComponent(r) +
        '&genres=' + encodeURIComponent(genres) +
        '&poster=' + encodeURIComponent(p) +
      '">' +
        '<div class="poster">' +
          (p ? '<img src="' + p + '" alt="" loading="lazy">' : '') +
          (r ? '<span class="rating">★ ' + r + '</span>' : '') +
          '<span class="play"></span>' +
        '</div>' +
        '<div class="name">' + title + '</div>' +
        (year ? '<div class="year">' + year + (genres ? " · " + genres : "") + '</div>' : '') +
      '</a>';
  }

  function renderDocs() {
    gridEl.innerHTML = state.docs.map(cardHtml).join("");
  }

  // ---------- загрузка ----------
  function currentUrl(page) {
    if (state.mode === "search") return searchUrl(state.query, page);
    if (state.mode === "best")   return catalogUrl(CATEGORIES[0], page);
    return catalogUrl(state.cat, page);
  }

  function setStatus(text, spin) {
    statusEl.innerHTML = text  
      ? (spin ? '<span class="spinner"></span>' : "") + text  
      : "";
  }

  function load(reset) {
    if (state.loading) return;
    state.loading = true;
    moreEl.hidden = true;

    if (reset) {
      state.page = 0;
      state.pages = 1;
      state.docs = [];
      gridEl.innerHTML = "";
    }

    var page = state.page + 1;
    var url = currentUrl(page);

    // заголовок  
    if (state.mode === "best") titleEl.textContent = "Шедевры";
    else if (state.mode === "search") titleEl.textContent = 'Поиск: «' + state.query + '»';
    else titleEl.textContent = state.cat ? state.cat.title.replace(/^\S+\s/, "") : "Каталог";

    updateChips();
    setStatus("Загружаем…", true);

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        console.log("[catalog]", url, d);
        var docs = (d && d.docs) || [];
        var total = (d && d.total) || 0;
        state.page = page;
        state.pages = (d && d.pages) || 1;
        state.docs = reset ? docs : state.docs.concat(docs);
        renderDocs();
        state.loading = false;

        if (!state.docs.length) {
          setStatus("Ничего не найдено. Попробуйте другую категорию или запрос.");
        } else {
          setStatus("Найдено: " + total + " · показано " + state.docs.length);
        }

        moreEl.hidden = !(state.docs.length < total && state.page < state.pages);

        if (d && d._err) {
          console.warn("[catalog] error:", d._err, d._text || "");
        }
      })
      .catch(function (e) {
        state.loading = false;
        console.log("[catalog] fetch error:", e);
        setStatus("Ошибка загрузки: " + ((e && e.message) || e));
      });
  }

  // ---------- обработчики ----------
  moreEl.addEventListener("click", function () { load(false); });

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = inputEl.value.trim();
    if (!q) return;
    state.mode = "search";
    state.query = q;
    state.cat = null;
    load(true);
  });

  // ---------- старт ----------
  renderChips();
  load(true);
})();
</script>

</body>
</html>
