<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayFrame</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <canvas id="bg-canvas"></canvas>

  <header class="top-bar glass-panel">
    <div class="logo">
      <span class="logo-mark"></span>
      <span class="logo-text">PlayFrame</span>
    </div>

    <nav class="main-nav">
      <button class="nav-link active" id="nav-movies" onclick="switchMainTab('movies')">
        <span class="nav-ico"></span><span class="nav-lbl">Фильмы</span>
      </button>
      <button class="nav-link" id="nav-games" onclick="switchMainTab('games')">
        <span class="nav-ico"></span><span class="nav-lbl">Игры</span>
      </button>
    </nav>

    <div class="actions">
      <button id="settings-toggle" class="btn-icon" title="Настройки"></button>
      <button id="playlists-toggle" class="btn-text" title="Плейлисты">
        <span class="pl-ico"></span><span>Плейлисты</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- ===================== ФИЛЬМЫ ===================== -->
    <section id="section-movies" class="main-section active">
      <div class="hero-block">
        <h1 class="hero-title">Что посмотрим?</h1>
        <p class="hero-subtitle">Найди фильм по названию, жанру или опиши настроение — подберём.</p>
      </div>

      <div class="auth-block">
        <button id="google-login-btn" class="google-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="">
          Войти через Google  
        </button>
        <div id="user-info" class="user-info" style="display: none;"></div>
      </div>

      <div class="control-panel glass-panel">
        <div class="tabs">
          <button class="tab-btn active" data-target="tab-name">
            <span class="tab-ico"></span><span class="tab-lbl">Поиск</span>
          </button>
          <button class="tab-btn" data-target="tab-ai">
            <span class="tab-ico"></span><span class="tab-lbl">Нейросеть</span>
          </button>
        </div>

        <div id="tab-name" class="tab-content active">
          <div class="input-row">
            <input type="text" id="search-input" placeholder="Введите название фильма...">
            <button id="search-btn">
              <span>Найти</span><span class="btn-ico">→</span>
            </button>
          </div>
          <div class="quick-actions">
            <button id="random-btn" class="chip"><span class="chip-ico"></span> Удиви меня</button>
            <button id="masterpiece-btn" class="chip gold"><span class="chip-ico"></span> Шедевр</button>
          </div>
        </div>

        <div id="tab-ai" class="tab-content">
          <div class="input-row">
            <input type="text" id="ai-input" placeholder="Опиши, что хочется: «грустное про океан», «как Марсианин»">
            <button id="ai-button">
              <span>Подобрать</span><span class="btn-ico">→</span>
            </button>
          </div>
          <p id="ai-status" class="status"></p>
        </div>

        <details class="dropdown">
          <summary><span>🎛 Фильтры</span></summary>
          <div class="dropdown-content">
            <div class="filter-row">
              <label>Рейтинг от</label>
              <input type="range" id="rating-filter" min="0" max="10" step="0.5" value="0">
              <span id="rating-value">0</span>
            </div>
            <div class="filter-row">
              <label>Год от</label>
              <input type="number" id="year-filter" min="1900" max="2026" value="1900">
            </div>
            <label class="check-row"><input type="checkbox" id="filter-unwatched"> Только непросмотренные</label>
            <label class="check-row"><input type="checkbox" id="filter-new"> Только новинки</label>
          </div>
        </details>

        <details class="dropdown">
          <summary><span> Категории</span></summary>
          <div class="dropdown-content">
            <div class="moods" id="moods">
              <button data-mood="action"><span class="mood-ico"></span> Боевики</button>
              <button data-mood="comedy"><span class="mood-ico"></span> Комедии</button>
              <button data-mood="scifi"><span class="mood-ico"></span> Фантастика</button>
              <button data-mood="fantasy"><span class="mood-ico"></span> Фэнтези</button>
              <button data-mood="thriller"><span class="mood-ico"></span> Триллеры</button>
              <button data-mood="crime"><span class="mood-ico">🕵️</span> Криминал</button>
              <button data-mood="romance"><span class="mood-ico"></span> Мелодрамы</button>
              <button data-mood="cartoon"><span class="mood-ico"></span> Мультфильмы</button>
              <button data-mood="horror"><span class="mood-ico"></span> Ужасы</button>
              <button data-mood="adventure"><span class="mood-ico"></span> Приключения</button>
            </div>
          </div>
        </details>
      </div>

      <div class="type-switch" id="type-switch" style="display: none;">
        <button data-type="movie" class="active"> Фильмы</button>
        <button data-type="series"> Сериалы</button>
        <button data-type="cartoon"> Мультики</button>
      </div>

      <div id="results" class="results"></div>
      <button id="load-more" class="load-more" style="display: none;">Показать ещё</button>
    </section>

    <!-- ===================== ИГРЫ ===================== -->
    <section id="section-games" class="main-section">
      <div class="hero-block">
        <h1 class="hero-title">Во что поиграем?</h1>
        <p class="hero-subtitle">Найди игру по названию или опиши нейросети, какое настроение тебе сейчас по душе.</p>
      </div>

      <div class="control-panel glass-panel">
        <div class="tabs">
          <button class="game-tab-btn tab-btn active" data-target="game-tab-name">
            <span class="tab-ico"></span><span class="tab-lbl">Поиск</span>
          </button>
          <button class="game-tab-btn tab-btn" data-target="game-tab-ai">
            <span class="tab-ico"></span><span class="tab-lbl">Нейросеть</span>
          </button>
        </div>

        <div id="game-tab-name" class="game-tab-content tab-content active">
          <div class="input-row">
            <input type="text" id="game-search-input" placeholder="Поиск игры по названию или описанию...">
            <button id="game-search-btn">
              <span>Найти</span><span class="btn-ico">→</span>
            </button>
          </div>
          <div class="quick-actions">
            <button id="game-random-btn" class="chip"><span class="chip-ico"></span> Удиви меня</button>
            <button id="game-popular-btn" class="chip gold"><span class="chip-ico"></span> Популярное</button>
          </div>
        </div>

        <div id="game-tab-ai" class="game-tab-content tab-content">
          <div class="input-row">
            <input type="text" id="game-ai-input" placeholder="Опиши, во что хочешь поиграть: расслабиться, как Dark Souls, с сюжетом...">
            <button id="game-ai-btn">
              <span>Подобрать</span><span class="btn-ico"></span>
            </button>
          </div>
          <p id="game-ai-status" class="status"></p>
          <div class="ai-hints">
            <button class="ai-hint-chip" data-query="хочу расслабиться и отдохнуть"><span class="hi-ico"></span> Расслабиться</button>
            <button class="ai-hint-chip" data-query="игра с глубоким сюжетом и выборами"><span class="hi-ico"></span> Сюжет</button>
            <button class="ai-hint-chip" data-query="сложная игра с высокой сложностью как Dark Souls"><span class="hi-ico"></span> Хардкор</button>
            <button class="ai-hint-chip" data-query="короткая игра на вечер до 5 часов"><span class="hi-ico"></span> На вечер</button>
            <button class="ai-hint-chip" data-query="игра для компании с друзьями онлайн"><span class="hi-ico"></span> С друзьями</button>
            <button class="ai-hint-chip" data-query="самая лучшая игра всех времен"><span class="hi-ico"></span> Шедевр</button>
          </div>
        </div>

        <details class="dropdown" open>
          <summary><span> Настроения</span></summary>
          <div class="dropdown-content">
            <div class="mood-chips" id="game-moods">
              <button class="mood-chip active" data-mood="all"><span class="mood-ico"></span> Все</button>
              <button class="mood-chip" data-mood="relax"><span class="mood-ico"></span> Расслабиться</button>
              <button class="mood-chip" data-mood="action"><span class="mood-ico"></span> Экшен</button>
              <button class="mood-chip" data-mood="story"><span class="mood-ico"></span> Сюжет</button>
              <button class="mood-chip" data-mood="hardcore"><span class="mood-ico"></span> Хардкор</button>
              <button class="mood-chip" data-mood="horror"><span class="mood-ico"></span> Хоррор</button>
            </div>
          </div>
        </details>

        <details class="dropdown">
          <summary><span>🎛 Фильтры</span></summary>
          <div class="dropdown-content">
            <div class="games-filter-row">
              <div class="filter-group">
                <label> Цена</label>
                <select id="game-price-filter" class="filter-select">
                  <option value="all">Любая</option>
                  <option value="free">Бесплатные</option>
                  <option value="under10">До 10 $</option>
                  <option value="10to20">10 – 20 $</option>
                  <option value="over20">Дороже 20 $</option>
                </select>
              </div>
              <div class="filter-group">
                <label> Год</label>
                <select id="game-year-filter" class="filter-select">
                  <option value="all">Все годы</option>
                  <option value="2020+">2020 и новее</option>
                  <option value="2015_2019">2015 – 2019</option>
                  <option value="2010_2014">2010 – 2014</option>
                  <option value="2000_2009">2000 – 2009</option>
                  <option value="before2000">До 2000</option>
                </select>
              </div>
              <div class="filter-group">
                <label> Сортировка</label>
                <select id="game-sort-filter" class="filter-select">
                  <option value="popular">Сначала популярные</option>
                  <option value="metacritic">По Metacritic</option>
                  <option value="price_asc">По цене ↑</option>
                  <option value="year_desc">По году выхода</option>
                </select>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div id="game-loader" class="results-info">Загрузка базы игр...</div>
      <div id="games-count" class="results-info"></div>
      <div id="games-results" class="results"></div>
      <button id="games-load-more" class="load-more" style="display: none;">Показать ещё</button>
    </section>
  </main>

  <aside id="settings-panel" class="side-panel">
    <div class="panel-header"><h2>Настройки</h2><button id="settings-close" class="btn-icon">✕</button></div>
    <div class="setting-group">
      <label>Цвет акцента</label>
      <div class="color-row">
        <button class="color-dot" data-accent="blue" style="background:#3b82f6"></button>
        <button class="color-dot" data-accent="purple" style="background:#a855f7"></button>
        <button class="color-dot" data-accent="pink" style="background:#ec4899"></button>
        <button class="color-dot" data-accent="green" style="background:#10b981"></button>
        <button class="color-dot" data-accent="orange" style="background:#f59e0b"></button>
        <button class="color-dot" data-accent="red" style="background:#ef4444"></button>
        <button class="color-dot" data-accent="cyan" style="background:#06b6d4"></button>
      </div>
    </div>
    <div class="setting-group">
      <label>Тема</label>
      <div class="row">
        <button class="theme-btn active" data-theme="dark"> Тёмная</button>
        <button class="theme-btn" data-theme="light"> Светлая</button>
      </div>
    </div>
    <button id="settings-reset" class="reset-btn">Сбросить</button>
  </aside>

  <aside id="playlists-panel" class="side-panel">
    <div class="panel-header"><h2>Плейлисты</h2><button id="playlists-close" class="btn-icon">✕</button></div>
    <div class="playlist-create">
      <input type="text" id="playlist-name-input" placeholder="Название...">
      <button id="playlist-create-btn">Создать</button>
    </div>
    <div id="playlists-list" class="playlists-list"></div>
  </aside>

  <div id="movie-modal" class="modal">
    <div class="modal-content">
      <button id="movie-modal-close" class="btn-icon modal-close">✕</button>
      <div id="movie-modal-body"></div>
    </div>
  </div>

  <div id="game-modal" class="modal">
    <div class="modal-content">
      <button id="game-modal-close" class="btn-icon modal-close">✕</button>
      <div id="game-modal-body"></div>
    </div>
  </div>

  <div id="profile-modal" class="modal">
    <div class="modal-content" style="max-width:420px;">
      <button id="profile-modal-close" class="btn-icon modal-close">✕</button>
      <div style="padding:24px;">
        <h2>Профиль</h2>
        <div style="text-align:center; margin:18px 0;">
          <img id="profile-avatar-img" style="width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid var(--accent);">
        </div>
        <label class="setting-label">Имя</label>
        <input type="text" id="profile-name-input" class="input">
        <label class="setting-label">Аватарка (URL)</label>
        <input type="text" id="profile-avatar-input" class="input">
        <label class="setting-label">Цвет ника</label>
        <div class="color-row" style="margin-bottom:20px;">
          <button class="profile-color-dot" data-color="#e8eaed" style="background:#e8eaed"></button>
          <button class="profile-color-dot" data-color="#ff6b6b" style="background:#ff6b6b"></button>
          <button class="profile-color-dot" data-color="#ffd76e" style="background:#ffd76e"></button>
          <button class="profile-color-dot" data-color="#10b981" style="background:#10b981"></button>
          <button class="profile-color-dot" data-color="#3b82f6" style="background:#3b82f6"></button>
          <button class="profile-color-dot" data-color="#a855f7" style="background:#a855f7"></button>
        </div>
        <div id="profile-stats" class="stats-box"></div>
        <button id="profile-save-btn" class="btn-primary" style="width:100%; margin-top:20px;">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd7a0IJ_54SacowpCs4EZF5BIFKy-3qxw",
      authDomain: "movie-a9fdf.firebaseapp.com",
      projectId: "movie-a9fdf",
      storageBucket: "movie-a9fdf.firebasestorage.app",
      messagingSenderId: "398219529169",
      appId: "1:398219529169:web:8cf9008857598dc8032ef0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseSignIn = signInWithPopup;
    window.firebaseSignOut = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.firebaseDoc = doc;
    window.firebaseSetDoc = setDoc;
    window.firebaseGetDoc = getDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
  <script src="script.js"></script>
</body>
</html>
