<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подбор фильмов по настроению</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Какое у тебя настроение?</h1>
    <p>Выбери настроение — мы подберём фильм</p>
  </header>

  <main>
    <div class="ai-block">
      <h3>Не знаешь, чего хочешь?</h3>
      <p>Опиши своё настроение словами, и мы подберём жанр</p>
      <div class="ai-input-row">
        <input type="text" id="ai-input" placeholder="например: хочу что-то тёплое и смешное">
        <button id="ai-button">Подобрать</button>
      </div>
      <p id="ai-status" class="ai-status"></p>
    </div>

    <div class="moods" id="moods">
      <button data-mood="happy">Весело</button>
      <button data-mood="sad">Грустно</button>
      <button data-mood="action">Хочу адреналина</button>
      <button data-mood="cozy">Уютно</button>
      <button data-mood="scary">Хочу испугаться</button>
      <button data-mood="romance">Романтика</button>
      <button data-mood="nostalgia">Ностальгия</button>
      <button data-mood="inspire">Вдохновение</button>
      <button data-mood="mystery">Загадка / детектив</button>
      <button data-mood="scifi">Фантастика</button>
      <button data-mood="music">Музыка и танцы</button>
      <button data-mood="think">Хочу подумать</button>
    </div>

    <div id="results" class="results"></div>
  </main>

  <script src="https://js.puter.com/v2/"></script>
  <script src="script.js"></script>
</body>
</html>
