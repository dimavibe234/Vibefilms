<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperHeroFilms</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <div class="logo">SuperHeroFilms</div>
    <div class="actions">
      <button id="settings-toggle" class="btn-icon" title="Настройки"></button>
      <button id="playlists-toggle" class="btn-text" title="Плейлисты"> Плейлисты</button>
    </div>
  </header>

  <main class="container">
    <div class="auth-block">
      <button id="google-login-btn" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18">
        Войти через Google  
      </button>
      <div id="user-info" class="user-info" style="display: none;"></div>
    </div>

    <div class="control-panel">
      <div class="tabs">
        <button class="tab-btn active" data-target="tab-name"> Поиск</button>
        <button class="tab-btn" data-target="tab-ai"> Нейросеть</button>
      </div>

      <div id="tab-name" class="tab-content active">
        <div class="input-row">
          <input type="text" id="search-input" placeholder="Введите название фильма...">
          <button id="search-btn">Найти</button>
        </div>
        <div class="quick-actions">
          <button id="random-btn" class="chip"> Удиви меня</button>
          <button id="masterpiece-btn" class="chip gold"> Шедевр</button>
        </div>
      </div>

      <div id="tab-ai" class="tab-content">
        <div class="input-row">
          <input type="text" id="ai-input" placeholder="Опиши, что хочется: «грустное про океан», «как Марсианин»">
          <button id="ai-button">Подобрать</button>
        </div>
        <p id="ai-status" class="status"></p>
      </div>

      <details class="dropdown">
        <summary> Фильтры</summary>
        <div class="dropdown-content">
          <div class="filter-row">
            <label>Рейтинг от</label>
            <input type="range" id="rating-filter" min="0" max="10" step="0.5" value="0">
            <span id="rating-value">0</span>
          </div>
          <div class="filter-row">
            <label>Год от</label>
            <input type="number" id="year-filter" min="1900" max="2026" value="1900">
          </div>
          <label class="check-row"><input type="checkbox" id="filter-unwatched"> Только непросмотренные</label>
          <label class="check-row"><input type="checkbox" id="filter-new"> Только новинки</label>
        </div>
      </details>

      <details class="dropdown">
        <summary> Выбрать настроение</summary>
        <div class="dropdown-content moods" id="moods">
          <button data-mood="happy"> Весело</button>
          <button data-mood="sad"> Грустно</button>
          <button data-mood="action"> Адреналин</button>
          <button data-mood="cozy"> Уютно</button>
          <button data-mood="scary"> Страшно</button>
          <button data-mood="romance"> Романтика</button>
          <button data-mood="nostalgia"> Ностальгия</button>
          <button data-mood="inspire"> Вдохновение</button>
          <button data-mood="mystery">🕵️ Детектив</button>
          <button data-mood="scifi"> Фантастика</button>
          <button data-mood="music"> Музыка</button>
          <button data-mood="think"> Подумать</button>
          <button data-mood="anime"> Аниме</button>
          <button data-mood="fantasy"> Фэнтези</button>
          <button data-mood="crime"> Криминал</button>
          <button data-mood="thriller"> Триллер</button>
          <button data-mood="documentary"> Документальное</button>
          <button data-mood="sport"> Спорт</button>
          <button data-mood="war"> Военное</button>
          <button data-mood="western"> Вестерн</button>
          <button data-mood="biography"> Биография</button>
          <button data-mood="kids"> Для детей</button>
          <button data-mood="adventure"> Приключения</button>
          <button data-mood="comedy_dark"> Чёрная комедия</button>
          <button data-mood="mystic"> Мистика</button>
          <button data-mood="musical"> Мюзикл</button>
          <button data-mood="family"> Семейное</button>
          <button data-mood="heist"> Ограбление</button>
          <button data-mood="survival"> Выживание</button>
          <button data-mood="space"> Космос</button>
        </div>
      </details>
    </div>

    <div class="type-switch" id="type-switch" style="display: none;">
      <button data-type="movie" class="active"> Фильмы</button>
      <button data-type="series"> Сериалы</button>
      <button data-type="cartoon"> Мультики</button>
    </div>

    <div id="results" class="results"></div>
    <button id="load-more" class="load-more" style="display: none;">Показать ещё</button>
  </main>

  <aside id="settings-panel" class="side-panel">
    <div class="panel-header"><h2>Настройки</h2><button id="settings-close" class="btn-icon">✕</button></div>
    <div class="setting-group">
      <label>Цвет акцента</label>
      <div class="color-row">
        <button class="color-dot" data-accent="blue" style="background:#3a7bd5"></button>
        <button class="color-dot" data-accent="purple" style="background:#8b5cf6"></button>
        <button class="color-dot" data-accent="pink" style="background:#ec4899"></button>
        <button class="color-dot" data-accent="green" style="background:#10b981"></button>
        <button class="color-dot" data-accent="orange" style="background:#f59e0b"></button>
        <button class="color-dot" data-accent="red" style="background:#ef4444"></button>
        <button class="color-dot" data-accent="cyan" style="background:#06b6d4"></button>
      </div>
    </div>
    <div class="setting-group">
      <label>Тема</label>
      <div class="row">
        <button class="theme-btn active" data-theme="dark">Тёмная</button>
        <button class="theme-btn" data-theme="light">Светлая</button>
      </div>
    </div>
    <button id="settings-reset" class="reset-btn">Сбросить</button>
  </aside>

  <aside id="playlists-panel" class="side-panel">
    <div class="panel-header"><h2>Плейлисты</h2><button id="playlists-close" class="btn-icon">✕</button></div>
    <div class="playlist-create">
      <input type="text" id="playlist-name-input" placeholder="Название...">
      <button id="playlist-create-btn">Создать</button>
    </div>
    <div id="playlists-list" class="playlists-list"></div>
  </aside>

  <div id="movie-modal" class="modal">
    <div class="modal-content">
      <button id="movie-modal-close" class="btn-icon" style="position:absolute; top:10px; right:10px; z-index:10;">✕</button>
      <div id="movie-modal-body"></div>
    </div>
  </div>

  <div id="profile-modal" class="modal">
    <div class="modal-content" style="max-width:400px;">
      <button id="profile-modal-close" class="btn-icon" style="position:absolute; top:10px; right:10px;">✕</button>
      <div style="padding:20px;">
        <h2>Профиль</h2>
        <div style="text-align:center; margin:15px 0;"><img id="profile-avatar-img" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--accent);"></div>
        <label class="setting-label">Имя</label>
        <input type="text" id="profile-name-input" class="input">
        <label class="setting-label">Аватарка (URL)</label>
        <input type="text" id="profile-avatar-input" class="input">
        <label class="setting-label">Цвет ника</label>
        <div class="color-row" style="margin-bottom:20px;">
          <button class="profile-color-dot" data-color="#e8eaed" style="background:#e8eaed"></button>
          <button class="profile-color-dot" data-color="#ff6b6b" style="background:#ff6b6b"></button>
          <button class="profile-color-dot" data-color="#ffd76e" style="background:#ffd76e"></button>
          <button class="profile-color-dot" data-color="#10b981" style="background:#10b981"></button>
          <button class="profile-color-dot" data-color="#3a7bd5" style="background:#3a7bd5"></button>
          <button class="profile-color-dot" data-color="#8b5cf6" style="background:#8b5cf6"></button>
        </div>
        <div id="profile-stats" class="stats-box"></div>
        <button id="profile-save-btn" class="btn-primary" style="width:100%; margin-top:20px;">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd7a0IJ_54SacowpCs4EZF5BIFKy-3qxw",
      authDomain: "movie-a9fdf.firebaseapp.com",
      projectId: "movie-a9fdf",
      storageBucket: "movie-a9fdf.firebasestorage.app",
      messagingSenderId: "398219529169",
      appId: "1:398219529169:web:8cf9008857598dc8032ef0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseSignIn = signInWithPopup;
    window.firebaseSignOut = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.firebaseDoc = doc;
    window.firebaseSetDoc = setDoc;
    window.firebaseGetDoc = getDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script src="script.js"></script>

  <!-- ============================================================
       ПАТЧ: 10 категорий + фикс кнопки «Шедевр»
       Не трогает script.js, не затрагивает регистрацию/плейлисты/профиль  
       ============================================================ -->
  <script>
  (function () {
    var BASE = "https://functions.yandexcloud.net/d4e3i0pd816463uq33eu";
    var TRAILER = "./trailer.html";

    // ---- 10 основных категорий ----
    var CATEGORIES = [
      { key: "action",    label: " Боевики",     params: { genre: "боевик",      minRating: "6.5", minVotes: "20000" } },
      { key: "comedy",    label: " Комедии",     params: { genre: "комедия",     minRating: "6.5", minVotes: "20000" } },
      { key: "scifi",     label: " Фантастика",  params: { genre: "фантастика",  minRating: "6.5", minVotes: "20000" } },
      { key: "fantasy",   label: " Фэнтези",     params: { genre: "фэнтези",     minRating: "6.5", minVotes: "20000" } },
      { key: "thriller",  label: " Триллеры",    params: { genre: "триллер",     minRating: "7",   minVotes: "20000" } },
      { key: "crime",     label: "🕵️ Криминал",    params: { genre: "криминал",    minRating: "7",   minVotes: "30000" } },
      { key: "romance",   label: " Мелодрамы",   params: { genre: "мелодрама",   minRating: "6.5", minVotes: "20000" } },
      { key: "cartoon",   label: " Мультфильмы", params: { type:  "cartoon",     minRating: "6.5", minVotes: "10000" } },
      { key: "horror",    label: " Ужасы",       params: { genre: "ужасы",       minRating: "6",   minVotes: "10000" } },
      { key: "adventure", label: " Приключения", params: { genre: "приключения", minRating: "7",   minVotes: "20000" } }
    ];

    function buildUrl(params) {
      var p = Object.assign({ catalog: "1", page: "1", limit: "30" }, params || {});
      return BASE + "?" + Object.keys(p).map(function (k) {
        return k + "=" + encodeURIComponent(p[k]);
      }).join("&");
    }

    function posterOf(d) {
      return (d && d.poster && (d.poster.url || d.poster.previewUrl)) || "";
    }

    function ratingOf(d) {
      if (!d || !d.rating) return "";
      var r = d.rating.kp || d.rating.imdb || 0;
      return r >= 1 ? (Math.round(r * 10) / 10).toFixed(1) : "";
    }

    function hideLoadMore() {
      var lm = document.getElementById("load-more");
      if (lm) lm.style.display = "none";
    }

    function render(docs) {
      var results = document.getElementById("results");
      if (!results) return;
      hideLoadMore();

      if (!docs || !docs.length) {
        results.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:.6;padding:30px">Ничего не найдено</p>';
        return;
      }

      results.innerHTML = docs.map(function (d) {
        var poster = posterOf(d);
        var rating = ratingOf(d);
        var name = d.name || d.alternativeName || "Без названия";
        var year = d.year || "";
        var genres = (d.genres || []).slice(0, 2).map(function (g) { return g.name; }).join(", ");
        var href = TRAILER +
          "?kp=" + encodeURIComponent(d.id) +
          "&title=" + encodeURIComponent(name) +
          "&year=" + encodeURIComponent(year) +
          "&rating=" + encodeURIComponent(rating) +
          "&genres=" + encodeURIComponent(genres) +
          "&poster=" + encodeURIComponent(poster);

        return '<a href="' + href + '" style="display:flex;flex-direction:column;background:#151b23;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.06)">' +
          '<div style="position:relative;aspect-ratio:2/3;background:#222">' +
            (poster ? '<img src="' + poster + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" alt="">' : '') +
            (rating ? '<span style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);color:#ffd84d;padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:700">★ ' + rating + '</span>' : '') +
          '</div>' +
          '<div style="padding:8px 10px">' +
            '<div style="font-size:.88rem;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">' + name + '</div>' +
            (year ? '<div style="font-size:.76rem;opacity:.6;margin-top:3px">' + year + (genres ? " · " + genres : "") + '</div>' : '') +
          '</div>' +
        '</a>';
      }).join("");
    }

    function load(params) {
      var results = document.getElementById("results");
      if (results) results.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:.6;padding:30px">Загружаем…</p>';

      fetch(buildUrl(params))
        .then(function (r) { return r.json(); })
        .then(function (d) { render(d.docs || []); })
        .catch(function (e) {
          console.error("[categories] error:", e);
          if (results) results.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:.6;padding:30px">Ошибка загрузки</p>';
        });
    }

    // ---- перерисовать блок «Настроение» в 10 категорий ----
    function rebuildMoods() {
      var moods = document.getElementById("moods");
      if (!moods) return;

      moods.innerHTML = CATEGORIES.map(function (c) {
        return '<button data-category="' + c.key + '">' + c.label + '</button>';
      }).join("");

      moods.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-category]");
        if (!btn) return;
        var cat = CATEGORIES.filter(function (c) { return c.key === btn.dataset.category; })[0];
        if (!cat) return;
        load(cat.params);
      });

      var details = moods.closest("details");
      if (details) {
        var sum = details.querySelector("summary");
        if (sum) sum.textContent = " Категории";
      }
    }

    // ---- кнопка «Шедевр» — перехват, жёсткие фильтры ----
    function fixMasterpiece() {
      var btn = document.getElementById("masterpiece-btn");
      if (!btn) return;
      btn.addEventListener("click", function (e) {
        e.stopImmediatePropagation();
        e.preventDefault();
        load({ best: "1" });
      }, true); // capture: срабатывает раньше обработчика script.js  
    }

    function init() {
      rebuildMoods();
      fixMasterpiece();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>

</body>
</html>
