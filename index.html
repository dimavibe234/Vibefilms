<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayFrame</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <canvas id="bg-canvas"></canvas>

  <header class="top-bar glass-panel">
    <div class="logo"> PlayFrame</div>

    <nav class="main-nav">
      <button class="nav-link active" id="nav-movies" onclick="switchMainTab('movies')"> Фильмы</button>
      <button class="nav-link" id="nav-games" onclick="switchMainTab('games')"> Игры</button>
    </nav>

    <div class="actions">
      <button id="settings-toggle" class="btn-icon" title="Настройки"></button>
      <button id="playlists-toggle" class="btn-text" title="Плейлисты"> Плейлисты</button>
    </div>
  </header>

  <main class="container">
    <!-- ===================== ФИЛЬМЫ ===================== -->
    <section id="section-movies" class="main-section active">
      <div class="auth-block">
        <button id="google-login-btn" class="google-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="">
          Войти через Google  
        </button>
        <div id="user-info" class="user-info" style="display: none;"></div>
      </div>

      <div class="control-panel glass-panel">
        <div class="tabs">
          <button class="tab-btn active" data-target="tab-name"> Поиск</button>
          <button class="tab-btn" data-target="tab-ai"> Нейросеть</button>
        </div>

        <div id="tab-name" class="tab-content active">
          <div class="input-row">
            <input type="text" id="search-input" placeholder="Введите название фильма...">
            <button id="search-btn">Найти</button>
          </div>
          <div class="quick-actions">
            <button id="random-btn" class="chip"> Удиви меня</button>
            <button id="masterpiece-btn" class="chip gold"> Шедевр</button>
          </div>
        </div>

        <div id="tab-ai" class="tab-content">
          <div class="input-row">
            <input type="text" id="ai-input" placeholder="Опиши, что хочется: «грустное про океан», «как Марсианин»">
            <button id="ai-button">Подобрать</button>
          </div>
          <p id="ai-status" class="status"></p>
        </div>

        <details class="dropdown">
          <summary>🎛 Фильтры</summary>
          <div class="dropdown-content">
            <div class="filter-row">
              <label>Рейтинг от</label>
              <input type="range" id="rating-filter" min="0" max="10" step="0.5" value="0">
              <span id="rating-value">0</span>
            </div>
            <div class="filter-row">
              <label>Год от</label>
              <input type="number" id="year-filter" min="1900" max="2026" value="1900">
            </div>
            <label class="check-row"><input type="checkbox" id="filter-unwatched"> Только непросмотренные</label>
            <label class="check-row"><input type="checkbox" id="filter-new"> Только новинки</label>
          </div>
        </details>

        <details class="dropdown">
          <summary> Категории</summary>
          <div class="dropdown-content moods" id="moods">
            <button data-mood="action"> Боевики</button>
            <button data-mood="comedy"> Комедии</button>
            <button data-mood="scifi"> Фантастика</button>
            <button data-mood="fantasy"> Фэнтези</button>
            <button data-mood="thriller"> Триллеры</button>
            <button data-mood="crime">🕵️ Криминал</button>
            <button data-mood="romance"> Мелодрамы</button>
            <button data-mood="cartoon"> Мультфильмы</button>
            <button data-mood="horror"> Ужасы</button>
            <button data-mood="adventure"> Приключения</button>
          </div>
        </details>
      </div>

      <div class="type-switch" id="type-switch" style="display: none;">
        <button data-type="movie" class="active"> Фильмы</button>
        <button data-type="series"> Сериалы</button>
        <button data-type="cartoon"> Мультики</button>
      </div>

      <div id="results" class="results"></div>
      <button id="load-more" class="load-more" style="display: none;">Показать ещё</button>
    </section>

    <!-- ===================== ИГРЫ ===================== -->
    <section id="section-games" class="main-section">
      <div class="control-panel glass-panel">
        <div class="input-row">
          <input type="text" id="game-search-input" placeholder="Поиск игры по названию или описанию...">
          <button id="game-search-btn">Найти</button>
        </div>

        <div class="mood-chips" id="game-moods">
          <button class="mood-chip active" data-mood="all"> Все</button>
          <button class="mood-chip" data-mood="relax"> Расслабиться</button>
          <button class="mood-chip" data-mood="action"> Экшен</button>
          <button class="mood-chip" data-mood="story"> Сюжет</button>
          <button class="mood-chip" data-mood="hardcore"> Хардкор</button>
          <button class="mood-chip" data-mood="horror"> Хоррор</button>
        </div>

        <div class="games-filter-row">
          <div class="filter-group">
            <label> Цена:</label>
            <select id="game-price-filter" class="filter-select">
              <option value="all">Любая</option>
              <option value="free">Бесплатные</option>
              <option value="under10">До 10 $</option>
              <option value="10to20">10 – 20 $</option>
              <option value="over20">Дороже 20 $</option>
            </select>
          </div>
          <div class="filter-group">
            <label> Год:</label>
            <select id="game-year-filter" class="filter-select">
              <option value="all">Все годы</option>
              <option value="2020+">2020 и новее</option>
              <option value="2015_2019">2015 – 2019</option>
              <option value="2010_2014">2010 – 2014</option>
              <option value="2000_2009">2000 – 2009</option>
              <option value="before2000">До 2000</option>
            </select>
          </div>
          <div class="filter-group">
            <label> Сортировка:</label>
            <select id="game-sort-filter" class="filter-select">
              <option value="popular">Сначала популярные</option>
              <option value="metacritic">По Metacritic</option>
              <option value="price_asc">По цене ↑</option>
              <option value="year_desc">По году выхода</option>
            </select>
          </div>
        </div>
      </div>

      <div id="game-loader" class="results-info">Загрузка базы игр...</div>
      <div id="games-count" class="results-info"></div>
      <div id="games-results" class="results"></div>
      <button id="games-load-more" class="load-more" style="display: none;">Показать ещё</button>
    </section>
  </main>

  <!-- ==== Панель настроек ==== -->
  <aside id="settings-panel" class="side-panel">
    <div class="panel-header"><h2>Настройки</h2><button id="settings-close" class="btn-icon">✕</button></div>
    <div class="setting-group">
      <label>Цвет акцента</label>
      <div class="color-row">
        <button class="color-dot" data-accent="blue" style="background:#3a7bd5"></button>
        <button class="color-dot" data-accent="purple" style="background:#8b5cf6"></button>
        <button class="color-dot" data-accent="pink" style="background:#ec4899"></button>
        <button class="color-dot" data-accent="green" style="background:#10b981"></button>
        <button class="color-dot" data-accent="orange" style="background:#f59e0b"></button>
        <button class="color-dot" data-accent="red" style="background:#ef4444"></button>
        <button class="color-dot" data-accent="cyan" style="background:#06b6d4"></button>
      </div>
    </div>
    <div class="setting-group">
      <label>Тема</label>
      <div class="row">
        <button class="theme-btn active" data-theme="dark">Тёмная</button>
        <button class="theme-btn" data-theme="light">Светлая</button>
      </div>
    </div>
    <button id="settings-reset" class="reset-btn">Сбросить</button>
  </aside>

  <!-- ==== Панель плейлистов ==== -->
  <aside id="playlists-panel" class="side-panel">
    <div class="panel-header"><h2>Плейлисты</h2><button id="playlists-close" class="btn-icon">✕</button></div>
    <div class="playlist-create">
      <input type="text" id="playlist-name-input" placeholder="Название...">
      <button id="playlist-create-btn">Создать</button>
    </div>
    <div id="playlists-list" class="playlists-list"></div>
  </aside>

  <!-- ==== Модалка фильма ==== -->
  <div id="movie-modal" class="modal">
    <div class="modal-content">
      <button id="movie-modal-close" class="btn-icon" style="position:absolute; top:10px; right:10px; z-index:10;">✕</button>
      <div id="movie-modal-body"></div>
    </div>
  </div>

  <!-- ==== Модалка игры ==== -->
  <div id="game-modal" class="modal">
    <div class="modal-content">
      <button id="game-modal-close" class="btn-icon" style="position:absolute; top:10px; right:10px; z-index:10;">✕</button>
      <div id="game-modal-body"></div>
    </div>
  </div>

  <!-- ==== Модалка профиля ==== -->
  <div id="profile-modal" class="modal">
    <div class="modal-content" style="max-width:400px;">
      <button id="profile-modal-close" class="btn-icon" style="position:absolute; top:10px; right:10px;">✕</button>
      <div style="padding:20px;">
        <h2>Профиль</h2>
        <div style="text-align:center; margin:15px 0;"><img id="profile-avatar-img" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--accent);"></div>
        <label class="setting-label">Имя</label>
        <input type="text" id="profile-name-input" class="input">
        <label class="setting-label">Аватарка (URL)</label>
        <input type="text" id="profile-avatar-input" class="input">
        <label class="setting-label">Цвет ника</label>
        <div class="color-row" style="margin-bottom:20px;">
          <button class="profile-color-dot" data-color="#e8eaed" style="background:#e8eaed"></button>
          <button class="profile-color-dot" data-color="#ff6b6b" style="background:#ff6b6b"></button>
          <button class="profile-color-dot" data-color="#ffd76e" style="background:#ffd76e"></button>
          <button class="profile-color-dot" data-color="#10b981" style="background:#10b981"></button>
          <button class="profile-color-dot" data-color="#3a7bd5" style="background:#3a7bd5"></button>
          <button class="profile-color-dot" data-color="#8b5cf6" style="background:#8b5cf6"></button>
        </div>
        <div id="profile-stats" class="stats-box"></div>
        <button id="profile-save-btn" class="btn-primary" style="width:100%; margin-top:20px;">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd7a0IJ_54SacowpCs4EZF5BIFKy-3qxw",
      authDomain: "movie-a9fdf.firebaseapp.com",
      projectId: "movie-a9fdf",
      storageBucket: "movie-a9fdf.firebasestorage.app",
      messagingSenderId: "398219529169",
      appId: "1:398219529169:web:8cf9008857598dc8032ef0"  
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseSignIn = signInWithPopup;
    window.firebaseSignOut = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.firebaseDoc = doc;
    window.firebaseSetDoc = setDoc;
    window.firebaseGetDoc = getDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
  <script src="script.js"></script>
</body>
</html>
