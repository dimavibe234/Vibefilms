<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="origin">
<title>Трейлер — SuperHeroFilms</title>
<style>
  :root { --bg:#0b0f14; --card:#151b23; --text:#e8eaed; --muted:#8f9bab; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  #bg { position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; filter:blur(40px) brightness(.35) saturate(1.2); transform:scale(1.15); }
  #bg::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(11,15,20,.5) 0%,rgba(11,15,20,.95) 70%,var(--bg) 100%); }
  main { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:24px 20px 60px; }
  .back { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.9rem; margin-bottom:28px; }
  .back:hover { color: var(--text); }
  .hero { display:flex; gap:28px; align-items:flex-start; margin-bottom:28px; }
  .hero img { width:200px; aspect-ratio:2/3; object-fit:cover; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.6); flex-shrink:0; background:var(--card); }
  .hero-info { flex:1; min-width:0; }
  .hero h1 { margin:0 0 10px; font-size:2rem; line-height:1.2; letter-spacing:-.02em; }
  .hero .meta { margin:0 0 14px; color:var(--muted); font-size:1rem; }
  .genres { display:flex; flex-wrap:wrap; gap:6px; }
  .genre { display:inline-block; padding:4px 12px; border-radius:999px; font-size:.78rem; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:var(--muted); white-space:nowrap; }

  .player { background:var(--card); border-radius:16px; border:1px solid rgba(255,255,255,.06); overflow:hidden; margin-bottom:16px; }
  .player-frame { position:relative; width:100%; padding-top:56.25%; background:#000; }
  .player-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .player-status { padding:28px 20px; text-align:center; color:var(--muted); font-size:.9rem; line-height:1.5; }

  .alt-results { padding:14px 18px; border-top:1px solid rgba(255,255,255,.06); }
  .alt-results h3 { margin:0 0 10px; font-size:.85rem; color:var(--muted); font-weight:600; }
  .alt-results .item { display:flex; align-items:center; gap:10px; padding:8px 0; text-decoration:none; color:var(--text); font-size:.85rem; border-bottom:1px solid rgba(255,255,255,.04); }
  .alt-results .item:last-child { border-bottom:0; }
  .alt-results .item:hover { color:#fff; }
  .alt-results .item img { width:80px; height:45px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#000; }
  .alt-results .item .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .servers { background:var(--card); border-radius:16px; border:1px solid rgba(255,255,255,.06); padding:18px 20px; margin-bottom:16px; }
  .servers h2 { margin:0 0 6px; font-size:1rem; }
  .servers .hint { margin:0 0 14px; font-size:.82rem; color:var(--muted); line-height:1.45; }
  .source-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .source { display:flex; align-items:center; justify-content:center; padding:12px 14px; border-radius:10px; font-weight:600; font-size:.85rem; text-decoration:none; color:#fff; transition:filter .2s, transform .15s; }
  .source:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .source.kp { background:linear-gradient(135deg,#ff5500,#cc4400); }
  .source.yt { background:linear-gradient(135deg,#ff0000,#c00); }
  .source.rt { background:linear-gradient(135deg,#00a6ff,#0077cc); }
  .source.vk { background:linear-gradient(135deg,#0077ff,#0055bb); }
  .footnote { margin:18px 0 0; font-size:.76rem; color:var(--muted); text-align:center; }

  @media (max-width:640px) {
    main { padding:18px 14px 40px; }
    .hero { flex-direction:column; gap:18px; align-items:center; text-align:center; }
    .hero img { width:140px; }
    .hero h1 { font-size:1.5rem; }
    .genres { justify-content:center; }
  }
</style>
</head>
<body>

<div id="bg"></div>

<main>
  <a class="back" href="./">← На главную</a>

  <section class="hero">
    <img id="poster" alt="">
    <div class="hero-info">
      <h1 id="title">Загрузка…</h1>
      <p class="meta" id="meta"></p>
      <div class="genres" id="genres"></div>
    </div>
  </section>

  <section class="player">
    <div id="player-slot"><div class="player-status">Ищем трейлер…</div></div>
  </section>

  <section class="servers">
    <h2>Если трейлер не играет</h2>
    <p class="hint">Откройте источник напрямую — там точно есть видео.</p>
    <div class="source-grid">
      <a id="src-kp" class="source kp" target="_blank" rel="noopener">Кинопоиск</a>
      <a id="src-yt" class="source yt" target="_blank" rel="noopener">YouTube</a>
      <a id="src-rt" class="source rt" target="_blank" rel="noopener">Rutube</a>
      <a id="src-vk" class="source vk" target="_blank" rel="noopener">VK Видео</a>
    </div>
  </section>

  <p class="footnote">Трейлер встраивается через Rutube / YouTube.</p>
</main>

<script>
(function () {
  var BASE = "https://functions.yandexcloud.net/d4e3i0pd816463uq33eu";
  var q = new URLSearchParams(location.search);
  var title  = q.get("title")  || "";
  var year   = q.get("year")   || "";
  var kp     = q.get("kp")     || "";
  var poster = q.get("poster") || "";
  var rating = q.get("rating") || "";
  var genres = q.get("genres") || "";

  document.title = (title || "Трейлер") + " — SuperHeroFilms";
  document.getElementById("title").textContent = title || "Трейлер";

  var metaParts = [];
  if (year) metaParts.push(year);
  if (rating) metaParts.push("★ " + rating);
  document.getElementById("meta").textContent = metaParts.join(" · ");

  if (poster) {
    document.getElementById("poster").src = poster;
    document.getElementById("bg").style.backgroundImage = "url('" + poster + "')";
  } else {
    document.getElementById("poster").style.display = "none";
  }

  if (genres) {
    var gEl = document.getElementById("genres");
    genres.split(",").forEach(function (g) {
      if (!g.trim()) return;
      var s = document.createElement("span");
      s.className = "genre";
      s.textContent = g.trim();
      gEl.appendChild(s);
    });
  }

  var searchQuery = encodeURIComponent((title + " " + (year || "") + " трейлер").trim());

  document.getElementById("src-kp").href = kp  
    ? "https://www.kinopoisk.ru/film/" + kp + "/video/"
    : "https://www.kinopoisk.ru/index.php?kp_query=" + encodeURIComponent(title);
  document.getElementById("src-yt").href = "https://www.youtube.com/results?search_query=" + searchQuery;
  document.getElementById("src-rt").href = "https://rutube.ru/search/?query=" + searchQuery;
  document.getElementById("src-vk").href = "https://vk.com/video?q=" + searchQuery;

  var slotEl = document.getElementById("player-slot");

  function iframeHtml(src) {
    return '<div class="player-frame"><iframe src="' + src + '" frameborder="0" ' +
      'referrerpolicy="origin" allowfullscreen ' +
      'allow="autoplay; fullscreen; encrypted-media; picture-in-picture; web-share"></iframe></div>';
  }

  function ytId(url) {
    if (!url) return null;
    var m = String(url).match(
      /(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/
    );
    return m ? m[1] : null;
  }

  function ytEmbedSrc(id) {
    var origin = (location.origin && location.origin !== "null") ? location.origin : "";
    var s = "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1&playsinline=1";
    if (origin) s += "&origin=" + encodeURIComponent(origin);
    return s;
  }

  function renderAlt(items, currentUrl) {
    var alt = (items || []).filter(function (it) {
      return it && it.url && it.url !== currentUrl;
    }).slice(0, 4);
    if (!alt.length) return "";
    var html = '<div class="alt-results"><h3>Другие варианты:</h3>';
    alt.forEach(function (it) {
      html += '<a class="item" href="' + it.url + '" target="_blank" rel="noopener">' +
              (it.thumb ? '<img src="' + it.thumb + '" alt="">' : '') +
              '<span class="t">' + (it.title || "Без названия") + '</span>' +
              '</a>';
    });
    html += '</div>';
    return html;
  }

  function tryEmbed(items) {
    if (!Array.isArray(items) || !items.length) return false;

    for (var j = 0; j < items.length; j++) {
      var u2 = (items[j] && items[j].url) || "";
      if (u2.indexOf("rutube.ru/play/embed") !== -1) {
        slotEl.innerHTML = iframeHtml(u2) + renderAlt(items, u2);
        return true;
      }
    }

    for (var i = 0; i < items.length; i++) {
      var u = (items[i] && items[i].url) || "";
      if (u.indexOf("widgets.kinopoisk.ru") !== -1) {
        slotEl.innerHTML = iframeHtml(u);
        return true;
      }
    }

    for (var k = 0; k < items.length; k++) {
      var vid = ytId(items[k] && items[k].url);
      if (vid) {
        slotEl.innerHTML = iframeHtml(ytEmbedSrc(vid));
        return true;
      }
    }

    return false;
  }

  function showFallback(msg) {
    slotEl.innerHTML = '<div class="player-status">' +
      (msg || "Трейлер не найден.") +
      '<br>Откройте источник вручную ниже — YouTube, Кинопоиск, Rutube или VK.</div>';
  }

  function tryRutube() {
    if (!title) { showFallback("Нет названия — откройте источник вручную ниже."); return; }
    var rq = (title + " " + (year || "") + " трейлер").trim();
    fetch(BASE + "?rutube=" + encodeURIComponent(rq))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        console.log("[trailer] rutube =", d);
        var items = (d && d.items) || [];
        if (tryEmbed(items)) return;
        showFallback("Трейлер не найден на Rutube.");
      })
      .catch(function (e) {
        console.log("[trailer] rutube error:", e);
        showFallback("Ошибка загрузки: " + ((e && e.message) || e));
      });
  }

  if (!kp) { tryRutube(); return; }

  fetch(BASE + "?videos=" + encodeURIComponent(kp))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      console.log("[trailer] videos =", d);
      var items = (d && d.items) || [];
      if (tryEmbed(items)) return;
      tryRutube();
    })
    .catch(function (e) {
      console.log("[trailer] videos error:", e);
      tryRutube();
    });
})();
</script>

</body>
</html>
